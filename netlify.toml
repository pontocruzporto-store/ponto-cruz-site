[build]
  command = "npx puppeteer browsers install chrome && npm run build"
  publish = "dist"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Canonical host: force HTTPS, non-www, and the canonical Portuguese home.
[[redirects]]
  from = "http://pontocruzconceptstore.pt/*"
  to = "https://pontocruzconceptstore.pt/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.pontocruzconceptstore.pt/*"
  to = "https://pontocruzconceptstore.pt/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.pontocruzconceptstore.pt/*"
  to = "https://pontocruzconceptstore.pt/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/pt"
  status = 301

# Unknown URLs should stay true 404s. Valid public routes are prerendered
# by the build into dist/<route>/index.html before Netlify publishes.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/logo-simple-*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
